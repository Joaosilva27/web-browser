name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          # Model provider key. Create one at https://opencode.ai/console and add it as a
          # repository secret named OPENCODE_API_KEY
          # (Settings > Secrets and variables > Actions > New repository secret).
          #
          # Using a different provider? Swap the two lines below together, for example:
          #   ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  +  model: anthropic/claude-sonnet-4-20250514
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # Change this to any model your provider key can access.
          model: opencode/deepseek-v4.1-flash-free
          # Skips the OpenCode GitHub App / OIDC exchange and uses GITHUB_TOKEN above.
          use_github_token: true
